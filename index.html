<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#0A3D91">

  <!-- Lien vers le manifeste -->
  <link rel="manifest" href="./manifest.json">
  
  <!-- Icône pour iOS -->
  <link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIj48cmVjdCB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgcng9Ijk2IiBmaWxsPSIjMEEzRDkxIi8+PHRleHQgeD0iNTAlIiB5PSI1MyUiIGRvbWluYW50LWJhc2VsaW5lPSJjZW50cmFsIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LWZhbWlseT0iQXJpYWwsc2Fucy1zZXJpZiIgZm9udC13ZWlnaHQ9ImJvbGQiIGZvbnQtc2l6ZT0iMzMwIiBmaWxsPSIjZmZmZmZmIj5BPC90ZXh0Pjwvc3ZnPg==">

  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f7f6f2; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
    #loader { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #f7f6f2; color: #0A3D91; font-family: sans-serif; font-weight: bold; font-size: 24px; z-index: 10; transition: opacity 0.3s; }
  </style>
</head>
<body>
  <div id="loader">Chargement d'ACADOMAX...</div>

  <!-- ⚠️ REMPLACEZ L'URL CI-DESSOUS PAR VOTRE LIEN /exec ACTUEL -->
  <iframe id="app" src="https://script.google.com/macros/s/AKfycbwU63DmsqfEAmMkg3m11pR9v5EA3zLWIWJ5N8LmBTk-B0mA4y0ZCD2JTbVJ0skCuzXY/exec" allow="clipboard-read; clipboard-write"></iframe>

  <script>
    // Masquer le chargement une fois l'application prête
    document.getElementById('app').onload = function() {
      document.getElementById('loader').style.opacity = '0';
      setTimeout(() => document.getElementById('loader').style.display = 'none', 300);
    };

    // Enregistrement du Service Worker (OBLIGATOIRE pour l'installation Android)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(reg => console.log('Service Worker enregistré avec succès.', reg))
          .catch(err => console.error('Erreur Service Worker :', err));
      });
    }
  </script>
</body>
</html>
